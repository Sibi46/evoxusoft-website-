{% extends 'base.html' %}{% block title %}{{ 'Edit job' if job_id else 'Post a job' }}{% endblock %}{% block content %}<a href="{{ url_for('dashboard') }}">Back to jobs</a><h1>{{ 'Edit job' if job_id else 'Post a job' }}.</h1><form method="post" class="job-form"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Job title<input name="title" value="{{ job.get('title','') }}" maxlength="140" required placeholder="e.g. Software Development Intern"></label><div class="form-row"><label>Department<input name="department" value="{{ job.get('department','') }}" maxlength="100" required placeholder="e.g. EVOXU SOFT"></label><label>Location<input name="location" value="{{ job.get('location','') }}" maxlength="140" required placeholder="e.g. Chennai / Remote"></label></div><div class="form-row"><label>Employment type<select name="employment_type" required>{% for type in types %}<option {% if job.get('employment_type') == type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select></label><label>Status<select name="status" required>{% for status in statuses %}<option value="{{ status }}" {% if job.get('status','draft') == status %}selected{% endif %}>{{ {'draft':'Draft - private','open':'Open - publish on Careers','closed':'Closed - hidden from Careers'}[status] }}</option>{% endfor %}</select></label></div><label>Job description<textarea name="description" rows="12" maxlength="12000" required placeholder="Describe responsibilities, requirements, working arrangements, and how candidates can contribute.">{{ job.get('description','') }}</textarea></label><p>Applicants use the website enquiry form. Their message includes this job title.</p><button type="submit">Save job</button></form>{% endblock %}
