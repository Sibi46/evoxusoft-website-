<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{% block title %}Job admin{% endblock %} | EVOXU</title><link rel="stylesheet" href="/admin.css"></head><body class="admin-body"><header class="admin-header"><a class="admin-logo" href="/">EVOXU<span> JOB ADMIN</span></a><a href="/#careers">View Careers</a>{% if session.get('admin_version') %}<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="secondary" type="submit">Sign out</button></form>{% endif %}</header><main class="admin-main">{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% endwith %}{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}{% block content %}{% endblock %}</main></body></html>
